# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

on:
  - pull_request
  - push

name: CI

jobs:
  coding-guidelines:
    name: Coding Guidelines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.0
          coverage: none
          tools: composer

      - uses: ramsey/composer-install@v4

      - name: Run friendsofphp/php-cs-fixer
        run: ./vendor/bin/php-cs-fixer fix --allow-risky=yes --dry-run --show-progress=dots --using-cache=no --verbose

  type-checker:
    name: Type Checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          # Psalm 6 needs PHP 8.2+; psalm.xml and phpstan.neon still analyse for 8.0.
          php-version: 8.4
          coverage: none
          tools: composer

      - uses: ramsey/composer-install@v4

      - name: Run Psalm
        run: composer psalm -- --shepherd --show-info=false --stats --output-format=github

      - name: Run PHPStan
        run: composer phpstan

  tests:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer

      - uses: ramsey/composer-install@v4

      - name: Run the unit test suite
        run: vendor/bin/phpunit --testsuite unit

      - name: Run the functional test suite
        run: vendor/bin/phpunit --testsuite functional

  coverage:
    name: Coverage (100%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.1
          coverage: pcov
          tools: composer

      - uses: ramsey/composer-install@v4

      - name: Run the whole suite, enforcing 100% line coverage
        run: composer coverage

  benchmarks:
    name: Benchmarks (no regression)
    # Compares this branch against its merge base in the same job, on the same runner —
    # absolute timings on shared CI hardware are meaningless, ratios are not.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          coverage: none
          ini-values: memory_limit=1G
          tools: composer

      - name: Benchmark the base branch
        run: |
          git checkout --quiet ${{ github.event.pull_request.base.sha }}
          composer install --no-interaction --no-ansi --no-progress --quiet
          php tools/benchmark.php --json > /tmp/base.json || echo '{"results":{}}' > /tmp/base.json

      - name: Benchmark this branch
        run: |
          git checkout --quiet ${{ github.event.pull_request.head.sha }}
          composer install --no-interaction --no-ansi --no-progress --quiet
          php tools/benchmark.php --json > /tmp/head.json

      - name: Compare
        run: php tools/benchmark-compare.php /tmp/base.json /tmp/head.json

  examples:
    name: Documentation examples
    # Every snippet in llms.txt / docs/llms has a runnable counterpart under example/.
    # Running them here is what stops the documentation from drifting: the README Quick
    # Start was a fatal error for years because nothing executed it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          coverage: none
          tools: composer

      - uses: ramsey/composer-install@v4

      - name: Run every example
        run: composer examples

      - name: Exercise the CLI
        run: |
          ./bin/edifact segments --tag=NAD > /dev/null
          ./bin/edifact --version > /dev/null
          ./bin/edifact inspect example/edifact-sample.edi > /dev/null
          cat example/edifact-sample.edi | ./bin/edifact parse > /dev/null

  package:
    name: Published package
    # .gitattributes decides what ships, and nothing else in the suite looks at the
    # published artefact — excluding src/ or schema/ by accident would pass every other job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          coverage: none
          tools: composer

      - name: Build the dist, install it, and use it
        run: sh tools/verify-package.sh
